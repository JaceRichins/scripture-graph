# Scripture Graph engine configuration (deep-merged over built-in defaults).
# Modes: aggressive | balanced | economical  (budgets per mode are built in;
# override any value here, e.g.  budgets: {balanced: {nightly_ai_jobs: 50}} )
# aggressive = the all-day build-out: 30-min study ticks, daily cap 200 AI jobs
mode: aggressive

study:
  window_minutes: 30    # matches the ScriptureGraph Study task cadence
  job_estimate_sec: 540 # don't start a job that can't finish inside the window

# Raised 2026-08-30 after the ChatGPT account upgrade. The old ceilings were
# never the binding constraint (only ~119 jobs had ever applied) — wasted work
# was. Paired with pipeline.transport_retries below, which rides out a
# rate-limit window instead of burning the queue against it.
budgets:
  aggressive:
    nightly_ai_jobs: 200
    weekly_ai_jobs: 350
    daily_ai_jobs_cap: 500
    # Both providers run on flat subscriptions (Claude Max + ChatGPT plan);
    # the per-call cost_usd the CLIs report is what usage WOULD cost via API,
    # not money leaving the account. Dual jobs report ~$0.64 each, so a $40
    # cap would silently stop the day at ~62 jobs. The real ceiling is
    # daily_ai_jobs_cap; this stays only as a runaway backstop.
    daily_usd_cap: 999.0
    job_timeout_sec: 600

pipeline:
  transport_retries: 5      # rate limit / CLI error: wait and try again
  transport_backoff_s: 6    # 6s, 12s, 24s, 48s between transport attempts
  schema_retries: 2         # bad JSON shape: retry immediately with the error

automation:
  enabled: true       # master switch for scheduled runs
  ai_enabled: true    # allow AI provider calls during scheduled runs
  # Parallel research workers -- the single throughput knob. A research job is
  # ~12 minutes of waiting on provider subprocesses against ~7 seconds of
  # landing, so workers buy nearly linear throughput. Raised from 1 on
  # 2026-09-01. The governor still paces AI spend; Codex is the constrained
  # provider (the engine is ~34% of its weekly tokens), Claude has the room.
  workers: 3

bootstrap:
  ai_jobs: 2          # AI research jobs to run during bootstrap demonstration

# Evidence recalibration (agents/calibrate.py, docs/EVIDENCE-STANDARD.md).
# Existing evidence notes are re-assessed to the evidence standard by two
# independent calibrators (Claude + Codex, emphases rotating), cross-critique,
# and a judge, with one canonical assessment per issue. Enabled for the Book
# of Mormon (owner's direction, 2026-09-03); the Bible is reviewed only
# (`scripturegraph calibrate --corpus Bible --review-only`) until approved.
calibrate:
  enabled: true    # validated on one live group 2026-09-03 (calib-…-93aecbcc); ticks run the rest
  corpora: ["Book of Mormon"]
  per_tick: 10

# Secondary sources (podcasts). items_per_night is the number of deep episode
# analyses the nightly run pays for; the default 3 is why only three episodes
# had ever been ingested. Raised 2026-09-02 — the podcast text is wanted.
secondary:
  items_per_night: 12
  backlog_per_night: 6

automation_notes: |
  nightly/weekly wait up to automation.long_lock_wait_sec (default 2700) for the
  engine lock and study ticks yield to them (see runners._locked). Before this
  every nightly since Aug 29 skipped on "engine lock held".

# Subject dossiers -- people, places, gospel topics, hard questions. Written
# ONLY after every chapter has been read (the "gate"); then they ride the
# same AI budget the research used. Defaults shown; uncomment to change.
# dossier:
#   after_research: true       # false = write dossiers now, from a partial reading
#   gate: read-once            # read-once = every chapter researched at least once
#                              # current = every chapter current at THIS corpus
#                              #           version (re-closes on every corpus bump)
#   types: [question, person, place, topic]
#   refresh_days: 90           # redo a dossier only if the corpus grew AND it is this old
#   verses_per_chapter: 4      # context size knobs
#   verse_cap: 60
#   findings_cap: 40

